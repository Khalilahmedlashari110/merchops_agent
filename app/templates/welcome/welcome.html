<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerchOps Agent - Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:     #0a0a18;
      --border: rgba(127,119,221,0.25);
      --purple: #7F77DD;
      --teal:   #1D9E75;
      --text:   #c8d0e8;
      --dim:    #5a6285;
      --glow-p: rgba(127,119,221,0.45);
      --glow-t: rgba(29,158,117,0.40);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .welcome-shell {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* TOP BAR */
    .top-bar {
      grid-column: 1/-1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 36px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,24,0.65); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--purple), var(--teal));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 17px; color: #fff; box-shadow: 0 0 14px var(--glow-p);
    }
    .brand-text { font-size: 14px; font-weight: 600; letter-spacing: .5px; }
    .brand-sub  { font-size: 11px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }
    .top-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--teal); border: 1px solid rgba(29,158,117,0.3);
      border-radius: 20px; padding: 4px 12px;
      animation: pulse-badge 2.5s ease-in-out infinite;
    }
    @keyframes pulse-badge {
      0%,100% { box-shadow: 0 0 0 0 rgba(29,158,117,0); }
      50%      { box-shadow: 0 0 0 4px rgba(29,158,117,0.15); }
    }

    /* BOT SIDE */
    .bot-side {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px 20px; gap: 12px;
      perspective: 1200px; position: relative;
    }

    /* ROBOT WRAPPER — smooth float, no vibration */
    .robot-wrap {
      display: flex; flex-direction: column; align-items: center;
      will-change: transform;
      animation: bot-float 4s ease-in-out infinite;
    }
    @keyframes bot-float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-14px); }
    }

    /* SVG robot — 3D glow */
    .robot-svg {
      width: 240px; height: auto;
      filter: drop-shadow(0 0 18px rgba(127,119,221,0.38))
              drop-shadow(0 36px 48px rgba(0,0,0,0.72));
      transition: filter 0.5s ease;
    }
    .robot-wrap.state-speaking .robot-svg {
      filter: drop-shadow(0 0 24px rgba(29,158,117,0.5))
              drop-shadow(0 36px 48px rgba(0,0,0,0.72));
    }
    .robot-wrap.state-recognized .robot-svg {
      filter: drop-shadow(0 0 28px rgba(29,158,117,0.6))
              drop-shadow(0 36px 48px rgba(0,0,0,0.72));
    }

    /* EYES */
    .eye-rect {
      transform-box: fill-box; transform-origin: 50% 50%;
      animation: eye-blink 4.8s ease-in-out infinite;
      transition: fill 0.35s ease;
    }
    #eye-r { animation-delay: 0.22s; }
    @keyframes eye-blink {
      0%,43%,47%,100% { transform: scaleY(1); }
      45% { transform: scaleY(0.07); }
    }
    .robot-wrap.state-thinking .eye-rect {
      animation: eye-think 0.75s ease-in-out infinite alternate;
    }
    @keyframes eye-think {
      from { transform: translateX(-5px); }
      to   { transform: translateX(5px); }
    }
    .robot-wrap.state-listening .eye-rect { fill: #1D9E75 !important; }
    .robot-wrap.state-recognized .eye-rect { fill: #1D9E75 !important; }

    /* HEAD NOD when speaking */
    .robot-wrap.state-speaking .head-group {
      transform-box: fill-box; transform-origin: 50% 100%;
      animation: head-nod 0.55s ease-in-out infinite alternate;
    }
    @keyframes head-nod {
      from { transform: rotate(-1.2deg); }
      to   { transform: rotate(1.2deg); }
    }

    /* ARM WAVE when recognized */
    .arm-left {
      transform-box: fill-box; transform-origin: 50% 0%;
      transition: transform 0.4s ease;
    }
    .robot-wrap.state-recognized .arm-left {
      animation: arm-wave 2.2s ease-in-out forwards;
    }
    @keyframes arm-wave {
      0%   { transform: rotate(0deg); }
      10%  { transform: rotate(-44deg); }
      22%  { transform: rotate(-14deg); }
      34%  { transform: rotate(-44deg); }
      46%  { transform: rotate(-14deg); }
      58%  { transform: rotate(-40deg); }
      70%  { transform: rotate(-10deg); }
      84%  { transform: rotate(-24deg); }
      100% { transform: rotate(0deg); }
    }

    /* ANTENNA */
    .antenna-ball {
      transform-box: fill-box; transform-origin: 50% 50%;
      animation: ant-pulse 2s ease-in-out infinite;
    }
    @keyframes ant-pulse {
      0%,100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(0.78); opacity: 0.55; }
    }

    /* LEDs */
    .led { animation: led-blink 1.9s ease-in-out infinite; }
    .led-2 { animation-delay: 0.63s; }
    .led-3 { animation-delay: 1.26s; }
    @keyframes led-blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    /* BOT INFO */
    .bot-info { text-align: center; }
    .bot-name  { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .4px; }
    .bot-desc  { font-size: 12px; color: var(--dim); margin-top: 4px; }

    /* CAMERA */
    .camera-panel { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .camera-wrap {
      width: 106px; height: 80px; border-radius: 8px;
      overflow: hidden; position: relative;
      background: #050512; border: 1px solid var(--border);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .camera-wrap.scanning  { border-color: var(--purple); }
    .camera-wrap.recognized { border-color: var(--teal); box-shadow: 0 0 10px var(--glow-t); }
    #camera-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* Scan bar ONLY inside camera box — no full-page vibration */
    .camera-wrap.scanning::after {
      content: '';
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(127,119,221,0.75), transparent);
      will-change: transform;
      animation: cam-scan 2s linear infinite;
    }
    @keyframes cam-scan {
      from { transform: translateY(0); }
      to   { transform: translateY(80px); }
    }
    .cam-status {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--dim); transition: color 0.3s;
    }
    .cam-status.scanning  { color: var(--purple); }
    .cam-status.recognized { color: var(--teal); }

    /* CHAT SIDE */
    .chat-side {
      display: flex; flex-direction: column;
      padding: 26px 32px 26px 22px;
      border-left: 1px solid var(--border);
      background: rgba(10,10,24,0.38); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      gap: 14px;
    }
    .chat-header {
      font-size: 12px; color: var(--dim);
      font-family: 'JetBrains Mono', monospace; letter-spacing: .5px;
      border-bottom: 1px solid var(--border); padding-bottom: 10px;
    }
    .messages {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 11px;
      padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .msg { display: flex; gap: 10px; max-width: 90%; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px; min-width: 28px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .msg.bot  .msg-avatar { background: linear-gradient(135deg,#1a1a3e,#101030); border: 1px solid var(--purple); color: var(--purple); }
    .msg.user .msg-avatar { background: linear-gradient(135deg,#0e2b20,#0a1e18); border: 1px solid var(--teal);   color: var(--teal); }
    .msg-bubble {
      padding: 9px 13px; border-radius: 12px;
      font-size: 13px; line-height: 1.55;
    }
    .msg.bot  .msg-bubble { background: rgba(127,119,221,0.09); border: 1px solid rgba(127,119,221,0.18); color: #dde2f5; border-radius: 4px 12px 12px 12px; }
    .msg.user .msg-bubble { background: rgba(29,158,117,0.09);  border: 1px solid rgba(29,158,117,0.2);  color: #c8f0e4; border-radius: 12px 4px 12px 12px; }
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--purple);
      animation: ty-bounce .9s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes ty-bounce { 0%,80%,100%{transform:translateY(0);opacity:.5;} 40%{transform:translateY(-6px);opacity:1;} }

    .input-area { display: flex; gap: 8px; align-items: stretch; }
    .input-wrap {
      flex: 1; display: flex; align-items: center;
      background: rgba(15,15,38,0.8); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 12px; transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(127,119,221,0.14); }
    #user-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; font-family: 'Inter',sans-serif; padding: 11px 0;
    }
    #user-input::placeholder { color: var(--dim); }
    .icon-btn {
      width: 37px; height: 37px; border-radius: 8px;
      border: 1px solid var(--border); background: rgba(15,15,38,0.8);
      color: var(--dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: all .2s; flex-shrink: 0;
    }
    .icon-btn:hover      { border-color: var(--purple); color: var(--purple); }
    .icon-btn.active     { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 0 10px var(--glow-p); }
    .icon-btn.send       { background: var(--purple); border-color: var(--purple); color: #fff; }
    .icon-btn.send:hover { box-shadow: 0 0 14px var(--glow-p); }
    .mic-wave { display: none; align-items: center; gap: 2px; height: 18px; padding: 0 4px; }
    .mic-wave.active { display: flex; }
    .mic-wave span {
      width: 3px; border-radius: 2px; background: var(--purple);
      animation: w-bar .6s ease-in-out infinite alternate;
    }
    .mic-wave span:nth-child(1){height:6px;  animation-delay:.00s;}
    .mic-wave span:nth-child(2){height:13px; animation-delay:.10s;}
    .mic-wave span:nth-child(3){height:9px;  animation-delay:.20s;}
    .mic-wave span:nth-child(4){height:16px; animation-delay:.15s;}
    .mic-wave span:nth-child(5){height:7px;  animation-delay:.05s;}
    @keyframes w-bar { from{transform:scaleY(.4);opacity:.6;} to{transform:scaleY(1);opacity:1;} }

    /* BOTTOM BAR */
    .bottom-bar {
      grid-column: 1/-1;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 36px; border-top: 1px solid var(--border);
      background: rgba(10,10,24,0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .visitor-status {
      font-family: 'JetBrains Mono',monospace; font-size: 11px;
      color: var(--dim); display: flex; align-items: center; gap: 8px;
    }
    .visitor-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
    .visitor-status.known .dot { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
    .visitor-status.known      { color: var(--teal); }
    .enter-btn {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--purple), #5d55c0);
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 22px; border-radius: 10px; text-decoration: none;
      letter-spacing: .3px; transition: all .25s; box-shadow: 0 0 18px var(--glow-p);
    }
    .enter-btn:hover { box-shadow: 0 0 28px var(--glow-p); transform: translateY(-1px); }

    /* Natural assistant panel refinement */
    body {
      background:
        radial-gradient(ellipse 60% 42% at 80% 0%, rgba(56,189,248,.09), transparent 58%),
        linear-gradient(180deg, #0f1724 0%, #0b0f17 42%);
    }
    .top-bar,
    .bottom-bar { background: rgba(11,15,23,.78); }
    .brand-logo,
    .enter-btn { background: linear-gradient(135deg, #0ea5e9, #2563eb); box-shadow: 0 12px 28px rgba(37,99,235,.22); }
    .top-badge { background: rgba(74,222,128,.07); color: #4ade80; border-color: rgba(74,222,128,.22); animation: none; }
    .chat-side { background: rgba(11,15,23,.30); gap: 12px; }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 14px 16px; border: 1px solid rgba(125,211,252,.18);
      border-radius: 18px; background: rgba(18,26,38,.86);
      box-shadow: 0 18px 45px rgba(0,0,0,.20);
      font-family: 'Inter', sans-serif; letter-spacing: 0;
    }
    .assistant-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .assistant-avatar {
      width: 42px; height: 42px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(74,222,128,.10));
      border: 1px solid rgba(125,211,252,.22); color: #38bdf8; flex-shrink: 0;
    }
    .assistant-title { font-size: 15px; font-weight: 700; color: #fff; }
    .assistant-sub { margin-top: 2px; color: #7f8da3; font-size: 12px; line-height: 1.4; }
    .assistant-status {
      display: inline-flex; align-items: center; gap: 7px;
      color: #4ade80; background: rgba(74,222,128,.08);
      border: 1px solid rgba(74,222,128,.18);
      border-radius: 999px; padding: 6px 10px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .assistant-status::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 0 4px rgba(74,222,128,.12);
    }
    .prompt-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .prompt-chip {
      border: 1px solid rgba(125,211,252,.18); background: rgba(18,26,38,.72);
      color: #b9c6d8; border-radius: 999px; padding: 7px 11px;
      font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s, color .15s;
    }
    .prompt-chip:hover { transform: translateY(-1px); border-color: rgba(125,211,252,.36); background: rgba(56,189,248,.08); color: #eef8ff; }
    .msg { max-width: 88%; animation: msg-in .22s ease both; }
    @keyframes msg-in { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
    .msg-avatar { width: 31px; height: 31px; min-width: 31px; border-radius: 50%; }
    .msg.bot .msg-avatar { background: rgba(56,189,248,.10); border-color: rgba(125,211,252,.24); color: #38bdf8; }
    .msg.user .msg-avatar { background: rgba(74,222,128,.10); border-color: rgba(74,222,128,.22); color: #4ade80; }
    .msg-bubble { padding: 11px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.6; box-shadow: 0 10px 24px rgba(0,0,0,.14); }
    .msg.bot .msg-bubble { background: rgba(18,26,38,.92); border-color: rgba(125,211,252,.16); color: #e6edf3; border-radius: 8px 16px 16px 16px; }
    .msg.user .msg-bubble { background: linear-gradient(135deg, rgba(14,165,233,.22), rgba(37,99,235,.18)); border-color: rgba(125,211,252,.24); color: #f4fbff; border-radius: 16px 8px 16px 16px; }
    .input-area {
      border: 1px solid rgba(125,211,252,.18); background: rgba(18,26,38,.88);
      border-radius: 18px; padding: 8px; box-shadow: 0 18px 45px rgba(0,0,0,.18);
    }
    .input-wrap { background: transparent; border: 0; padding: 0 8px; }
    .input-wrap:focus-within { box-shadow: none; }
    .input-area:focus-within { border-color: rgba(125,211,252,.38); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }
    #user-input { font-size: 14px; }
    .icon-btn { width: 39px; height: 39px; border-radius: 12px; border-color: rgba(125,211,252,.16); background: rgba(148,163,184,.06); }
    .icon-btn:hover { border-color: rgba(125,211,252,.35); color: #38bdf8; }
    .icon-btn.active { background: #38bdf8; border-color: #38bdf8; color: #06121d; }
    .icon-btn.send { background: linear-gradient(135deg, #0ea5e9, #2563eb); border-color: transparent; }

    @media(max-width:768px){
      .welcome-shell { grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; }
      .bot-side { flex-direction:row; padding:14px; gap:14px; justify-content:flex-start; }
      .robot-svg { width:130px; }
      .bot-info { text-align:left; }
      .camera-panel { display:none; }
      .chat-side { border-left:none; border-top:1px solid var(--border); padding:14px; }
      .chat-header { align-items:flex-start; flex-direction:column; }
      .assistant-status { font-size:10px; }
    }
  </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="welcome-shell">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div>
        <div class="brand-text">MerchOps Agent</div>
        <div class="brand-sub">AI · Vision · Ops</div>
      </div>
    </div>
    <div class="top-badge">● SYSTEM ONLINE</div>
  </div>

  <!-- BOT SIDE -->
  <div class="bot-side" id="bot-side">

    <div class="robot-wrap state-idle" id="robot-wrap">
      <svg class="robot-svg" viewBox="0 0 240 448" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g-head" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#2e2e80"/>
            <stop offset="100%" stop-color="#0d0d30"/>
          </linearGradient>
          <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#272775"/>
            <stop offset="100%" stop-color="#0b0b2a"/>
          </linearGradient>
          <linearGradient id="g-arm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#212162"/>
            <stop offset="100%" stop-color="#090922"/>
          </linearGradient>
          <linearGradient id="g-leg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#1f1f5e"/>
            <stop offset="100%" stop-color="#080824"/>
          </linearGradient>
          <linearGradient id="g-foot" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#181852"/>
            <stop offset="100%" stop-color="#06061c"/>
          </linearGradient>
          <linearGradient id="g-panel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#323288"/>
            <stop offset="100%" stop-color="#131342"/>
          </linearGradient>
          <linearGradient id="g-neck" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#252568"/>
            <stop offset="100%" stop-color="#0d0d2e"/>
          </linearGradient>
          <linearGradient id="g-joint" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#3a3a7c"/>
            <stop offset="100%" stop-color="#14143c"/>
          </linearGradient>
          <linearGradient id="g-hand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#23236a"/>
            <stop offset="100%" stop-color="#0b0b2a"/>
          </linearGradient>
          <linearGradient id="g-ant" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#9990ee"/>
            <stop offset="100%" stop-color="#4a4598"/>
          </linearGradient>
          <radialGradient id="g-ground" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#7F77DD" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="g-eye" cx="35%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#b0aaff"/>
            <stop offset="100%" stop-color="#7F77DD"/>
          </radialGradient>
          <!-- Soft glow filter -->
          <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- Very soft glow for mouth -->

<script>
/* ── STATE ── */
const state = {
  visitorName: null, visitorId: null,
  history: [], cameraReady: false,
  recognizing: false, mouthTimer: null, scanInterval: null,
};

/* ── PARTICLES ── */
(function() {
  const cv = document.getElementById('particles-canvas');
  const cx = cv.getContext('2d');
  let W, H, pts;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  const make   = () => { pts = Array.from({length:110}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.3+0.3,
    dx: (Math.random()-.5)*.22, dy: (Math.random()-.5)*.22,
    a: Math.random()*.55+.1,
    c: Math.random()>.6?'#7F77DD':Math.random()>.5?'#1D9E75':'#fff',
  })); };
  const draw = () => {
    cx.clearRect(0,0,W,H);
    for (const p of pts) {
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=p.c; cx.globalAlpha=p.a; cx.fill();
      p.x+=p.dx; p.y+=p.dy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    }
    cx.globalAlpha=1; requestAnimationFrame(draw);
  };
  window.addEventListener('resize', () => { resize(); make(); });
  resize(); make(); draw();
})();

/* ── 3D TILT ON HOVER ── */
const botSide  = document.getElementById('bot-side');
const robotSvg = document.querySelector('.robot-svg');
botSide.addEventListener('mousemove', e => {
  const r  = botSide.getBoundingClientRect();
  const dx = (e.clientX - r.left  - r.width/2)  / (r.width/2);
  const dy = (e.clientY - r.top   - r.height/2) / (r.height/2);
  robotSvg.style.transition = '';
  robotSvg.style.transform  = `perspective(900px) rotateY(${dx*11}deg) rotateX(${-dy*7}deg)`;
});
botSide.addEventListener('mouseleave', () => {
  robotSvg.style.transition = 'transform 0.65s ease';
  robotSvg.style.transform  = '';
  setTimeout(() => { robotSvg.style.transition = ''; }, 650);
});

/* ── BOT STATE ── */
const bot  = document.getElementById('robot-wrap');
const segs = document.querySelectorAll('.mouth-seg');

function setBotState(s) {
  bot.className = `robot-wrap state-${s}`;
  if (s === 'speaking') startMouth(); else stopMouth();
}

function startMouth() {
  if (state.mouthTimer) return;
  state.mouthTimer = setInterval(() => {
    segs.forEach(seg => {
      const h = Math.round(Math.random() * 14 + 4); // 4–18 SVG units
      const y = 139 - h;                             // bottom-anchored at y=139
      seg.setAttribute('height', h);
      seg.setAttribute('y', y);
    });
  }, 95);
}

function stopMouth() {
  clearInterval(state.mouthTimer); state.mouthTimer = null;
  segs.forEach(seg => { seg.setAttribute('height', 10); seg.setAttribute('y', 129); });
}

/* ── CHAT ── */
const msgList = document.getElementById('messages');

function addMessage(role, text) {
  const w = document.createElement('div');
  w.className = `msg ${role}`;
  const icon = role === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';
  w.innerHTML = `<div class="msg-avatar">${icon}</div><div class="msg-bubble">${esc(text)}</div>`;
  msgList.appendChild(w); msgList.scrollTop = msgList.scrollHeight;
  return w;
}
function showTyping() {
  const w = document.createElement('div');
  w.className = 'msg bot'; w.id = 'typing';
  w.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div>
    <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgList.appendChild(w); msgList.scrollTop = msgList.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── TTS ── */

// Priority list: neural/natural voices first, then regional, then fallback
const VOICE_PRIORITY = [
  // Edge neural voices (most human-sounding)
  'Microsoft Jenny Online (Natural) - English (United States)',
  'Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Guy Online (Natural) - English (United States)',
  'Microsoft Ana Online (Natural) - English (United States)',
  // Chrome / Android high-quality
  'Google UK English Female',
  'Google UK English Male',
  'Google US English',
  // macOS built-in
  'Samantha', 'Karen', 'Moira', 'Tessa', 'Daniel', 'Alex',
  // Windows built-in
  'Microsoft Zira - English (United States)',
  'Microsoft David - English (United States)',
  'Microsoft Mark - English (United States)',
];

let _cachedVoice = null;

function pickVoice() {
  if (_cachedVoice) return _cachedVoice;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  _cachedVoice =
    VOICE_PRIORITY.reduce((found, name) => found || voices.find(v => v.name === name), null) ||
    // Prefer non-local (cloud/neural) English voices
    voices.find(v => /en[-_](US|GB|AU)/i.test(v.lang) && !v.localService && !v.name.includes('eSpeak')) ||
    // Fall back to any local English voice that isn't eSpeak
    voices.find(v => /en/i.test(v.lang) && !v.name.includes('eSpeak')) ||
    voices[0];
  return _cachedVoice;
}

// Warm up voice list as early as possible
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.addEventListener('voiceschanged', () => { _cachedVoice = null; pickVoice(); }, { once: true });
}

// Add a gentle comma-pause after sentence-ending punctuation so delivery feels thoughtful
function naturalise(text) {
  return text
    .replace(/([.!?])\s+/g, '$1,  ')   // breath after sentences
    .replace(/([;:])\s+/g,  '$1, ');   // short pause after colons
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();

  const u    = new SpeechSynthesisUtterance(naturalise(text));
  const voice = pickVoice();
  if (voice) u.voice = voice;

  u.rate   = 0.84;   // unhurried, conversational
  u.pitch  = 1.02;   // very slightly warm, not robotic-flat
  u.volume = 1.0;

  u.onstart = () => setBotState('speaking');
  u.onend   = () => setBotState('idle');
  u.onerror = () => setBotState('idle');

  // 150 ms lets the engine settle after cancel() before starting
  setTimeout(() => speechSynthesis.speak(u), 150);
}

/* ── API ── */
async function sendChat(userText) {
  setBotState('thinking'); showTyping();
  let reply = '';
  try {
    const res  = await fetch('/welcome/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: userText, visitor_name: state.visitorName, history: state.history.slice(-10) }),
    });
    reply = (await res.json()).reply || '';
  } catch(_) { reply = 'Sorry, connection issue. Please try again.'; }
  removeTyping();
  state.history.push({role:'user',content:userText}, {role:'assistant',content:reply});
  addMessage('bot', reply); speak(reply);
  if (!state.visitorName) {
    const m = userText.match(/(?:i(?:'m| am)|my name is|call me)\s+([A-Z][a-z]+)/i);
    if (m) saveVisitor(m[1]);
  }
}

async function saveVisitor(name) {
  const image = captureFrame();
  try {
    const d = await (await fetch('/welcome/api/save-visitor', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, image}),
    })).json();
    if (d.success) setVisitorKnown(d.visitor_id, d.name);
  } catch(_) {}
}

async function runFaceRecognition() {
  if (state.recognizing || !state.cameraReady || state.visitorName) return;
  state.recognizing = true;
  const image = captureFrame();
  if (!image) { state.recognizing = false; return; }
  try {
    const d = await (await fetch('/welcome/api/recognize', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({image}),
    })).json();
    if (d.recognized) {
      setVisitorKnown(d.visitor_id, d.name);
      const g = `Welcome back, ${d.name}! Great to see you again.`;
      addMessage('bot', g); speak(g);
      state.history.push({role:'assistant',content:g});
    }
  } catch(_) {}
  state.recognizing = false;
}

/* ── VISITOR KNOWN ── */
function setVisitorKnown(id, name) {
  state.visitorName = name; state.visitorId = id;
  document.getElementById('visitor-status').classList.add('known');
  document.getElementById('status-text').textContent = `Visitor: ${name}`;
  clearInterval(state.scanInterval);
  bot.classList.add('state-recognized');
  const cw = document.getElementById('camera-wrap');
  cw.className = 'camera-wrap recognized';
  const cs = document.getElementById('cam-status');
  cs.className = 'cam-status recognized';
  cs.textContent = `Recognized: ${name}`;
}

/* ── CAMERA ── */
const video      = document.getElementById('camera-video');
const capCvs     = document.getElementById('capture-canvas');
const camStat    = document.getElementById('cam-status');
const cameraWrap = document.getElementById('camera-wrap');

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      capCvs.width = video.videoWidth; capCvs.height = video.videoHeight;
      state.cameraReady = true;
      cameraWrap.className = 'camera-wrap scanning';
      camStat.className    = 'cam-status scanning';
      camStat.textContent  = 'Camera scanning...';
      state.scanInterval   = setInterval(runFaceRecognition, 4000);
    };
  } catch(_) { camStat.textContent = 'Camera permission needed'; }
}

function captureFrame() {
  if (!state.cameraReady) return null;
  const c = capCvs.getContext('2d');
  c.save(); c.scale(-1,1);
  c.drawImage(video, -capCvs.width, 0, capCvs.width, capCvs.height);
  c.restore();
  return capCvs.toDataURL('image/jpeg', 0.7);
}

/* ── SPEECH RECOGNITION ── */
const micBtn  = document.getElementById('mic-btn');
const micWave = document.getElementById('mic-wave');
let recognition = null;
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US';
  recognition.onstart  = () => { setBotState('listening'); micBtn.classList.add('active'); micWave.classList.add('active'); };
  recognition.onresult = e => { const t=e.results[0][0].transcript.trim(); if(t){addMessage('user',t);sendChat(t);} };
  recognition.onend    = () => { micBtn.classList.remove('active'); micWave.classList.remove('active'); if(bot.classList.contains('state-listening'))setBotState('idle'); };
  recognition.onerror  = () => { micBtn.classList.remove('active'); micWave.classList.remove('active'); setBotState('idle'); };
} else {
  micBtn.style.opacity='0.4'; micBtn.style.cursor='not-allowed';
}
micBtn.addEventListener('click', () => {
  if (!recognition) return;
  micBtn.classList.contains('active') ? recognition.stop() : recognition.start();
});

/* ── SEND ── */
const inputEl = document.getElementById('user-input');
document.getElementById('send-btn').addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key==='Enter') send(); });
function send() {
  const t = inputEl.value.trim(); if (!t) return;
  inputEl.value = ''; addMessage('user', t); sendChat(t);
}

document.querySelectorAll('.prompt-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.getAttribute('data-prompt');
    if (!t) return;
    addMessage('user', t);
    sendChat(t);
  });
});

/* ── BOOT ── */
async function boot() {
  setBotState('thinking');
  await new Promise(r => setTimeout(r, 900));
  setBotState('idle');
  const opener = "Hi, I am SmartOps Agent. I can explain MerchOps, help you log in, or answer quick questions before you enter. What should I call you?";
  addMessage('bot', opener); speak(opener);
  state.history.push({role:'assistant', content:opener});
  await initCamera();
}
boot();
</script>
